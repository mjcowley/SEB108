# Render the practicals site with Quarto and publish it to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
# One-off setup on GitHub: Settings > Pages > Source > GitHub Actions.

name: Publish practicals site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Render the site
        run: quarto render practicals

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: practicals/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
